services:
  - type: web
    name: My-Whatsapp-Agent
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OWNER_NAME
        value: "Md. Monjurul Islam Sir"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
