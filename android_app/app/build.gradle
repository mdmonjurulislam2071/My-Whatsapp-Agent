plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monjurul.whatsappagent'
    compileSdk 34

    defaultConfig {
        applicationId "com.monjurul.whatsappagent"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file('../release.jks')
            storePassword 'monjurul123'
            keyAlias 'agentkey'
            keyPassword 'monjurul123'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
